# Render Blueprint for CourseCraft.
#
# Deploy with:  render blueprint launch  (or "New > Blueprint" in the
# dashboard and point it at this repository).
#
# The frontend is NOT here — it is deployed to Vercel (free). This blueprint
# runs the API and the NLP service together in a single container, because
# Render's free tier allows 750 service-hours per month in total and two
# always-on services would need ~1440.
#
# After the first deploy, set the two values marked "sync: false" in the
# Render dashboard (Environment tab) — they have no sensible default:
#   DATABASE      -> mongodb+srv://... (MongoDB Atlas free M0 cluster)
#   GOOGLE_API_KEY -> a Gemini API key

services:
  - type: web
    name: coursecraft-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    # The API exposes /health, which Render polls to decide the service is live.
    healthCheckPath: /health
    buildCommand: |
      cd server && npm install --omit=dev && cd .. \
      && cd NLP && python3 -m pip install --no-cache-dir -r requirements.txt
    startCommand: ./server/scripts/start-production.sh
    envVars:
      - key: NODE_ENV
        value: production
      # grpcio/MarkupSafe have no cp314 wheels, so 3.14 cannot install the
      # NLP deps without a source build. /.python-version also pins this.
      - key: PYTHON_VERSION
        value: 3.13.5
      # The NLP service runs inside this same container on localhost.
      - key: NLP_URL
        value: http://127.0.0.1:3001
      - key: NLP_PORT
        value: "3001"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: JWT_EXPRIES_IN
        value: 10d
      - key: JWT_COOKIE_EXPIRES_IN
        value: "30"
      # Render generates a random secret on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Set these in the dashboard.
      - key: DATABASE
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
